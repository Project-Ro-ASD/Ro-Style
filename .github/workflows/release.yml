name: Release

# Ro-Repo V2 producer release for the Ro-Style package (Ro Qt widget style, derived from KDE Breeze).
# Based on Project-Ro-ASD/ro-Assist/.github/workflows/release.yml.
# Tag vX.Y.Z = component version (VERSION) = RPM Version; the package is new (ro-style-X.Y.Z-N.fc44), it replaces no Fedora package.

"on":
  push:
    tags:
      - "v*"
  # Dry run: builds and tests the RPMs without creating a release.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Resolve Release Metadata
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      rpm_version: ${{ steps.meta.outputs.rpm_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate exact tag, component version and spec
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          COMPONENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            TAG="${GITHUB_REF_NAME}"
            [[ "${TAG}" == "v${COMPONENT_VERSION}" ]]
          else
            TAG="dry-run"
          fi
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          python3 scripts/validate.py

          RPM_VERSION="$(awk '/^Version:/ { print $2; exit }' packaging/fedora/ro-style.spec)"
          [[ "${RPM_VERSION}" == "${COMPONENT_VERSION}" ]]

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "rpm_version=${RPM_VERSION}" >> "${GITHUB_OUTPUT}"

  rpm:
    name: Build Fedora 44 ro-style RPM (x86_64)
    needs: metadata
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install tools
        run: |
          dnf install -y git python3 gettext rpm-build rpmdevtools rpmlint createrepo_c \
            dnf5-plugins kf6-rpm-macros ccache tar zstd patch

      # Dry runs reuse compiled objects from earlier dry runs of the same branch (or main).
      # Tag releases never restore a cache: a published RPM is always built from scratch.
      - name: Restore compiler cache (dry run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-fedora44-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-fedora44-${{ github.ref_name }}-
            ccache-fedora44-main-

      - name: Patch and spec checks
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tests/check-patches.sh
          bash tests/check-spec.sh

      - name: Prepare sources and Ro-ASD spec
        shell: bash
        run: |
          set -euo pipefail
          TOPDIR="$HOME/rpmbuild"
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp packaging/fedora/ro-style.spec "$TOPDIR/SPECS/ro-style.spec"
          cp patches/breeze/*.patch "$TOPDIR/SOURCES/"

          # Source0 is breeze-%{breeze_version}.tar.xz: expand the one macro it uses instead of reading the raw spec line
          BREEZE_VERSION="$(awk '/^%global breeze_version/ { print $3; exit }' packaging/fedora/ro-style.spec)"
          SOURCE0="breeze-${BREEZE_VERSION}.tar.xz"
          SHA="$(python3 -c 'import json; print(json.load(open(".roasd/upstreams.json"))["projects"]["breeze"]["tarball_sha256"])')"
          spectool -g -C "$TOPDIR/SOURCES" -S "$TOPDIR/SPECS/ro-style.spec"
          echo "${SHA}  $TOPDIR/SOURCES/${SOURCE0}" | sha256sum -c -

          dnf builddep -y "$TOPDIR/SPECS/ro-style.spec"

      - name: Build RPM and SRPM
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "${DRY_RUN}" == "true" ]]; then
            # ccache via CMake's compiler launcher (rpmbuild keeps the environment).
            export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_BASEDIR="$HOME/rpmbuild/BUILD"
            export CCACHE_MAXSIZE=2G CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
            ccache -z
            # Test builds skip the debuginfo split; Ro-Repo never takes debuginfo packages.
            EXTRA+=(--define "debug_package %{nil}")
          fi
          rpmbuild -ba --define "_topdir $HOME/rpmbuild" --define "dist .fc44" "${EXTRA[@]}" \
            "$HOME/rpmbuild/SPECS/ro-style.spec"
          if [[ "${DRY_RUN}" == "true" ]]; then ccache -s; fi

      - name: Collect and validate the exact package set
        env:
          RPM_VERSION: ${{ needs.metadata.outputs.rpm_version }}
        shell: bash
        run: |
          set -euo pipefail
          TOPDIR="$HOME/rpmbuild"
          mkdir -p release-rpms
          # Only the names registered in Ro-Repo are published; debuginfo/debugsource stay out.
          mapfile -t NAMES < <(python3 -c 'import json; print("\n".join(json.load(open(".roasd/component.json"))["package_names"]))')
          for name in "${NAMES[@]}"; do
            f="$(find "$TOPDIR/RPMS/x86_64" -maxdepth 1 -name "${name}-${RPM_VERSION}-*.x86_64.rpm" -print -quit)"
            test -n "$f"
            [[ "$(rpm -qp --qf '%{NAME}' "$f")" == "${name}" ]]
            cp "$f" release-rpms/
          done
          cp "$TOPDIR"/SRPMS/ro-style-"${RPM_VERSION}"-*.src.rpm release-rpms/

          for f in release-rpms/*.rpm; do
            if [[ "$f" == *.src.rpm ]]; then
              [[ "$(basename "$f")" == "$(rpm -qp --qf '%{NAME}-%{VERSION}-%{RELEASE}.src.rpm' "$f")" ]]
            else
              [[ "$(basename "$f")" == "$(rpm -qp --qf '%{NVRA}.rpm' "$f")" ]]
            fi
            [[ "$(rpm -qp --qf '%{VERSION}' "$f")" == "${RPM_VERSION}" ]]
            [[ "$(rpm -qp --qf '%{RELEASE}' "$f")" =~ ^[0-9]+\.fc44$ ]]
          done
          ls -l release-rpms

      - name: rpmlint (advisory, same as Ro-Repo acceptance)
        shell: bash
        run: |
          rpmlint release-rpms/*.rpm || echo "::warning::rpmlint reported issues (advisory)"

      - name: Install and smoke test
        shell: bash
        run: |
          set -euxo pipefail
          dnf install -y release-rpms/ro-style-[0-9]*.x86_64.rpm
          rpm -q ro-style plasma-breeze-qt6
          # the plugin resolves all its symbols against the installed Qt and KDE libraries
          ldd -r /usr/lib64/qt6/plugins/styles/ro6.so > /dev/null
          test -f /usr/share/kstyle/themes/ro.themerc
          grep -q '^WidgetStyle=Ro$' /usr/share/kstyle/themes/ro.themerc
          # it sits next to Breeze and replaces nothing
          [[ "$(rpm -qf /usr/lib64/qt6/plugins/styles/ro6.so --qf '%{NAME}')" == "ro-style" ]]
          [[ "$(rpm -qf /usr/lib64/qt6/plugins/styles/breeze6.so --qf '%{NAME}')" == "plasma-breeze-qt6" ]]
          # the Qt style factory lists Ro (Qt metadata is read without a display)
          dnf install -y python3-pyside6 > /dev/null
          QT_QPA_PLATFORM=offscreen python3 -c "from PySide6.QtWidgets import QApplication, QStyleFactory; a = QApplication([]); k = QStyleFactory.keys(); print(k); assert 'Ro' in k and 'Breeze' in k"

      - name: Upload RPM bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-rpms-x86_64
          path: release-rpms/*.rpm
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish V2 Contract Release
    needs: [metadata, rpm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.metadata.outputs.tag }}

    steps:
      - name: Checkout trusted workflow source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download RPM bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-rpms-*
          path: bundle
          merge-multiple: true

      - name: Install RPM query tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm jq

      - name: Validate exact RPM set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find bundle -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          printf '%s\n' "${RPMS[@]}"
          [[ "${#RPMS[@]}" -eq 2 ]]
          [[ "$(printf '%s\n' "${RPMS[@]}" | grep -c '\.x86_64\.rpm$')" -eq 1 ]]
          [[ "$(printf '%s\n' "${RPMS[@]}" | grep -c '\.src\.rpm$')" -eq 1 ]]
          ! printf '%s\n' "${RPMS[@]}" | grep -qE 'debuginfo|debugsource'
          ! find bundle -maxdepth 1 -type f -name '*.rpm' | grep -qE '/.*(fc4[0-3]|fc45).*\.rpm$'

      - name: Create or recover draft release
        id: draft
        shell: bash
        run: |
          set -euo pipefail
          EXISTING="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate --jq ".[] | select(.tag_name == \"${TAG}\") | [.id,.draft,.target_commitish] | @tsv" | head -n1 || true)"
          if [[ -n "$EXISTING" ]]; then
            IFS=$'\t' read -r EXISTING_ID IS_DRAFT TARGET <<< "$EXISTING"
            if [[ "$IS_DRAFT" != "true" ]]; then
              echo "A published release already exists for ${TAG}; refusing reuse." >&2
              exit 1
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${EXISTING_ID}"
          fi

          RELEASE_JSON="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="${TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="${TAG}" \
            -F draft=true \
            -F generate_release_notes=true)"
          RELEASE_ID="$(jq -r '.id' <<<"${RELEASE_JSON}")"
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          echo "release_id=${RELEASE_ID}" >> "$GITHUB_OUTPUT"

      - name: Generate strict checksums and component manifest
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          cd bundle
          mapfile -t RPMS < <(find . -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          sha256sum "${RPMS[@]}" > SHA256SUMS

          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess

          root = pathlib.Path('.')
          artifacts = []
          query = '%{NAME}\t%{EPOCHNUM}\t%{VERSION}\t%{RELEASE}\t%{ARCH}\t%{SOURCERPM}\t%|SOURCEPACKAGE?{true}:{false}|'
          for path in sorted(root.glob('*.rpm')):
              values = subprocess.check_output(['rpm','-qp','--qf',query,str(path)], text=True).split('\t')
              if len(values) != 7:
                  raise SystemExit(f'Unexpected RPM header for {path}')
              name, epoch, version, release, arch, source_rpm, is_source = values
              if is_source == 'true':
                  arch = 'src'
                  source_rpm = None
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              artifacts.append({
                  'filename': path.name,
                  'name': name,
                  'epoch': int(epoch or 0),
                  'version': version,
                  'release': release,
                  'architecture': arch,
                  'source_rpm': source_rpm,
                  'producer_artifact_sha256': digest,
              })

          manifest = {
              'schema_version': 1,
              'component': 'ro-style',
              'source_repository': os.environ['GITHUB_REPOSITORY'],
              'source_commit': os.environ['GITHUB_SHA'],
              'release_tag': os.environ['TAG'],
              'release_id': int(os.environ['RELEASE_ID']),
              'workflow_run': int(os.environ['GITHUB_RUN_ID']),
              'fedora_release': 44,
              'artifacts': artifacts,
              'provenance': {'provider': 'github', 'subject_digest': 'sha256'},
              'attestation': {'provider': 'github', 'verification': 'gh attestation verify'},
          }
          pathlib.Path('component-artifact-manifest-v1.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY

          sha256sum -c SHA256SUMS

      - name: Attest exact release bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            bundle/*.rpm
            bundle/SHA256SUMS
            bundle/component-artifact-manifest-v1.json

      - name: Upload complete bundle to draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            bundle/*.rpm \
            bundle/SHA256SUMS \
            bundle/component-artifact-manifest-v1.json

      - name: Verify draft assets and publish
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t EXPECTED < <(
            { find bundle -maxdepth 1 -type f -name '*.rpm' -printf '%f\n'; printf '%s\n' SHA256SUMS component-artifact-manifest-v1.json; } | sort
          )
          mapfile -t ACTUAL < <(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --paginate --jq '.[].name' | sort)
          [[ "${#EXPECTED[@]}" -eq 4 ]]
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")

          gh release edit "$TAG" --draft=false
